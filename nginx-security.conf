# ============================================================
# UniLanding MY — Nginx Security Headers
# Include in your server block
# ============================================================

# Security headers
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:20128 http://127.0.0.1:20128; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Strict Transport Security (enable when using HTTPS)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent directory listing
autoindex off;

# Block access to hidden files
location ~ /\. {
    deny all;
    return 404;
}

# Cache control for static assets
location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1M;
    add_header Cache-Control "public, immutable";
}

# Prevent access to sensitive data files
location ~* \.(json|md|txt|log)$ {
    add_header X-Robots-Tag "noindex";
}